# This is a Declarative Automation Bundle definition for custom_whatsapp_task.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: custom_whatsapp_task
  uuid: df1a6856-a92e-4aa0-b64b-fe8cedd7eda5
  engine: direct

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel
  lakeflow_integrations_yaml:
    # inlined Python so the build is portable across Linux/Mac/Windows
    build: >
      uv run python -c "import shutil;
      shutil.rmtree('__generated__', ignore_errors=True);
      from databricks.lakeflow.integrations.generator.generate import main;
      main([
        '--package-module', 'custom_whatsapp_task',
        '--output-dir', '__generated__',
        '--environment-version', '5',
        '--environment-key', 'custom_whatsapp_task_environment',
        '--dependency', '${workspace.artifact_path}/.internal/custom_whatsapp_task-0.0.1-py3-none-any.whl',
      ])"
    files:
      # The generator writes .yml in the workspace template. Some versions write .yaml.
      - {"source": "__generated__/*.yml",}

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
      # Deploy to the current user's folder so there is a single copy.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
