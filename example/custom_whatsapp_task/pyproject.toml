[project]
name = "custom_whatsapp_task"
version = "0.0.1"
authors = []
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    "databricks-lakeflow-integrations",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/custom_whatsapp_task",
]

[dependency-groups]
dev = [
    # libraries part of serverless environment
    "requests",
    "databricks-sdk"
]

[[tool.uv.index]]
url = "https://pypi-proxy.cloud.databricks.com/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
